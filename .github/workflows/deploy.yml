name: Deploy to OVH VPS

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/wg-easy
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/wg-easy:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/wg-easy:buildcache,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Navigate to app directory
            mkdir -p $HOME/wg-easy
            cd $HOME/wg-easy

            # Pull latest changes or clone
            if [ -d ".git" ]; then
              echo "Updating existing repository..."
              git fetch origin
              git reset --hard origin/${{ github.ref_name }}
            else
              echo "Cloning repository..."
              # Remove any existing files if directory is not empty
              rm -rf ./*
              rm -rf ./.??*
              git clone https://github.com/${{ github.repository }} .
            fi

            # Create .env file with secrets
            cat > .env << EOF
            WG_PASSWORD=${{ secrets.WG_PASSWORD }}
            DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/wg-easy:latest
            EOF

            # Pull latest images
            sudo docker-compose pull

            # Restart services
            sudo docker-compose down
            sudo docker-compose up -d

            # Clean up old images
            sudo docker image prune -f

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd $HOME/wg-easy
            echo "Current directory: $(pwd)"
            echo "Files in directory:"
            ls -la
            sudo docker-compose ps
            sudo docker-compose logs --tail=50
