name: Deploy to OVH VPS

on:
  push:
    branches:
      - main
      - dev
      - init_vpn
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Define app directory
            APP_DIR="/opt/wg-easy"

            # Check if it's a valid git repository
            if [ -d "$APP_DIR/.git" ]; then
              echo "Updating existing repository..."
              cd "$APP_DIR"
              sudo git fetch origin
              sudo git reset --hard origin/${{ github.ref_name }}
              sudo git clean -fd
            else
              echo "Setting up fresh repository..."
              # Remove directory if it exists but is not a git repo
              if [ -d "$APP_DIR" ]; then
                echo "Removing existing non-git directory..."
                sudo rm -rf "$APP_DIR"
              fi
              # Create /opt directory if it doesn't exist
              sudo mkdir -p /opt
              # Clone repository
              sudo git clone https://github.com/${{ github.repository }} "$APP_DIR"
              cd "$APP_DIR"
              # Checkout the correct branch
              sudo git checkout ${{ github.ref_name }}
            fi

            # Verify docker-compose.yml exists
            if [ ! -f "docker-compose.yml" ]; then
              echo "ERROR: docker-compose.yml not found!"
              ls -la
              exit 1
            fi

            # Create .env file with secrets
            sudo bash -c "cat > .env << EOF
            WG_PASSWORD=${{ secrets.WG_PASSWORD }}
            EOF"

            # Pull latest images
            sudo docker-compose pull

            # Restart services
            sudo docker-compose down
            sudo docker-compose up -d

            # Clean up old images
            sudo docker image prune -f

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /opt/wg-easy
            echo "Current directory: $(pwd)"
            echo "Files in directory:"
            ls -la
            sudo docker-compose ps
            sudo docker-compose logs --tail=50
