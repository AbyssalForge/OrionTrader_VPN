name: Deploy to OVH VPS

on:
  push:
    branches:
      - main
      - dev
      - init_vpn
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/wg-easy
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/wg-easy:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/wg-easy:buildcache,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Define app directory
            APP_DIR="$HOME/wg-easy"

            # Check if it's a valid git repository
            if [ -d "$APP_DIR/.git" ]; then
              echo "Updating existing repository..."
              cd "$APP_DIR"
              git fetch origin
              git reset --hard origin/${{ github.ref_name }}
              git clean -fd
            else
              echo "Setting up fresh repository..."
              # Remove directory if it exists but is not a git repo
              if [ -d "$APP_DIR" ]; then
                echo "Removing existing non-git directory..."
                rm -rf "$APP_DIR"
              fi
              # Clone repository
              git clone https://github.com/${{ github.repository }} "$APP_DIR"
              cd "$APP_DIR"
            fi

            # Verify docker-compose.yml exists
            if [ ! -f "docker-compose.yml" ]; then
              echo "ERROR: docker-compose.yml not found!"
              ls -la
              exit 1
            fi

            # Create .env file with secrets
            cat > .env << EOF
            WG_PASSWORD=${{ secrets.WG_PASSWORD }}
            DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/wg-easy:latest
            EOF

            # Pull latest images
            sudo docker-compose pull

            # Restart services
            sudo docker-compose down
            sudo docker-compose up -d

            # Clean up old images
            sudo docker image prune -f

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd $HOME/wg-easy
            echo "Current directory: $(pwd)"
            echo "Files in directory:"
            ls -la
            sudo docker-compose ps
            sudo docker-compose logs --tail=50
